<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konu Oluştur - DijitalForum</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{
background:#0f172a;
color:#fff;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
}

.navbar{
background:#111827;
border-bottom:1px solid #1f2937;
padding:15px 0;
}

.logo{
font-size:28px;
font-weight:700;
color:#60a5fa;
}

.hero{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
padding:50px;
text-align:center;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
color:#dbeafe;
}

.form-box{
max-width:900px;
margin:40px auto;
background:#111827;
border-radius:12px;
overflow:hidden;
border:1px solid #1f2937;
}

.form-title{
background:#1e3a8a;
padding:18px;
font-size:20px;
font-weight:bold;
}

.form{
padding:25px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#cbd5e1;
}

input,
select,
textarea{
width:100%;
padding:14px;
background:#0f172a;
border:1px solid #334155;
border-radius:8px;
color:white;
font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#2563eb;
}

textarea{
height:250px;
resize:vertical;
}

.category-select{
background:#0f172a;
color:white;
}

.category-select option{
background:#111827;
}

.btn{
width:100%;
padding:15px;
background:#2563eb;
border:none;
border-radius:8px;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.btn:hover{
background:#1d4ed8;
}

.info-box{
background:#1e293b;
padding:15px;
border-radius:8px;
margin-bottom:20px;
color:#cbd5e1;
}

.footer{
background:#111827;
margin-top:40px;
padding:25px;
text-align:center;
color:#94a3b8;
}

</style>

</head>
<body>

<nav class="navbar">
<div class="container">
<div class="logo">
🚀 DijitalForum
</div>
</div>
</nav>

<section class="hero">
<h1>✏️ Konu Oluştur</h1>
<p>DijitalForum'da yeni bir konu paylaş</p>
</section>

<div class="container">

<div class="form-box">

<div class="form-title">
📝 Yeni Konu
</div>

<div class="form">

<div class="info-box">
Konu açmadan önce doğru kategoriyi seçtiğinizden emin olun.
</div>

<div class="form-group">
<label>📂 Kategori Seç</label>

<select class="category-select">

<optgroup label="💻 Donanım">
<option>Masaüstü Bilgisayarlar</option>
<option>Dizüstü Bilgisayarlar</option>
<option>İşlemciler</option>
<option>Ekran Kartları</option>
<option>Anakartlar</option>
<option>Monitörler</option>
</optgroup>

<optgroup label="🖥️ Yazılım">
<option>Windows</option>
<option>Linux</option>
<option>Programlama</option>
<option>Web Geliştirme</option>
</optgroup>

<optgroup label="🎮 Oyun">
<option>PC Oyunları</option>
<option>PlayStation</option>
<option>Xbox</option>
<option>Steam</option>
</optgroup>

<optgroup label="📱 Mobil">
<option>Android</option>
<option>iPhone</option>
<option>Tabletler</option>
</optgroup>

<optgroup label="🛠️ Teknik Destek">
<option>Sistem Toplama</option>
<option>Yardım ve Destek</option>
<option>Arıza Çözümleri</option>
</optgroup>

</select>

</div>

<div class="form-group">
<label>📌 Konu Başlığı</label>
<input type="text" placeholder="Konu başlığını girin">
</div>

<div class="form-group">
<label>💬 Mesajınız</label>
<textarea placeholder="Konu içeriğini yazın..."></textarea>
</div>

<div class="form-group">
<label>📎 Dosya Ekle</label>
<input type="file">
</div>

<button class="btn">
🚀 Konuyu Yayınla
</button>

</div>

</div>

</div>

<footer class="footer">
© 2026 DijitalForum - Tüm Hakları Saklıdır
</footer>

</body>
</html>
